<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Order summary card</title>
</head>
<body>
  <img src="images/pattern-background-desktop.svg" alt="a pattern" class="bg-pattern">
  <div class="outer-container">
  <img src="images/illustration-hero.svg" alt="an illustration" class="illustration">
  <div class="container">
  <h2 class="title">Order Summary</h2>
  <p class="card-description">You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!</p>
<div class="plans">
<div class="annual-plan">
  <img src="images/icon-music.svg" alt="a music icon" class="music-icon">
<div class="plan-info"> 
  <p class="duration">Annual Plan</p>
  <p class="price">$59.99/year</p>
</div> 
</div>
  <a href="#" class="plan-link">Change</a>
</div>
  <button type="button" href="#" class="payment-button">Proceed to Payment</button>
  <p class="cancel">Cancel Order</p>
  </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/anjola757-coder">Anjiee</a>.
  </footer>
</body>
</html>
